[project]
name = "rppg-vitals"
version = "0.1.0"
description = "Contactless heart rate and breathing rate from a webcam (remote photoplethysmography). Not a medical device."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "streamlit>=1.50",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
rppg-live = "rppg.live:main"
rppg-eval = "rppg.evaluate:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rppg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end test that runs MediaPipe on synthetic video"]
